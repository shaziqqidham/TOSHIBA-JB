name: Fetch images into repo
on:
  workflow_dispatch:
  push:
    paths: ["tools/assets.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp >/dev/null
      - run: bash tools/fetch-assets.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images logos
          git diff --cached --quiet || git commit -m "Store images locally (fetched automatically)"
          git push
